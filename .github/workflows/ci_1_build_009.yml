# =====================================================================
# .github/workflows/ci_1_build_009.yml
# ---------------------------------------------------------------------
# PlatformIO PR 빌드 및 에이전트 친화적 실패 마커 생성 파이프라인
#
# [설계 및 보안 원칙]
#   1. 보안 격리 (read-only):
#      - pull_request 이벤트는 Fork PR에서 GITHUB_TOKEN이 read-only로 강등됨.
#      - 본 워크플로우에서는 이슈 생성/코멘트 작업을 배제하고 빌드 및 아티팩트 업로드만 전담함.
#   2. 컨텍스트 조기 확보:
#      - platformio.ini 파싱 오류 등으로 환경 추출이 조기 중단되어도
#        PR 번호, 커밋 SHA 등의 메타데이터가 보존되도록 Checkout 직후 최우선 업로드함.
#   3. 에이전트 최적화 데이터 추출:
#      - 수만 줄의 성공/진행 로그 노이즈를 제거하고 핵심 정보만 추출함.
#      - error_files.txt: 실제 프로젝트 소스(PRJ::)와 외부 종속 헤더(EXT::)를 분리 태깅.
#      - agent_errors.txt: 컴파일러 진단 블록(앞뒤 3줄 맥락)만 선별 및 인접 중복 라인 제거(awk).
#      - failure.log: 아티팩트 다운로드가 제한된 CLI 환경을 대비한 후반 500줄 폴백 버퍼.
#   4. 파일시스템 로그 연속성:
#      - buildfs 실행 로그를 pio-build.log에 append(tee -a)하여 파일시스템 실패 원인 누락을 차단함.
#   5. 계약 문서 검증:
#      - build 전 계약 문서 무결성 gate(commit_contracts_0202.py)를 수행하여 계약 위반 머지를 차단함.
#      - commit_contracts_0202.py를 --dry-run/--strict로 실행.
#      - 실패 시 build job을 needs 의존으로 자동 스킵하여 조기 실패 유도.
#   6. 툴체인 캐시 무결성 (이중 방어):
#      - (1차) actions/cache 복원 후 실행 가능 여부를 검증하여 손상된 캐시는 삭제.
#      - (2차) pio pkg install 이후 bin/ 디렉토리가 비어 있으면
#              Espressif 공식 tar.gz를 수동 다운로드하여 복구.
#      - 캐시 키 접미사 -v4- 는 기존 손상 캐시 무효화 용도.
# =====================================================================

name: PR Build

on:
  pull_request:
    branches: [main, main-standalone]
    paths:
      - 'platformio.ini'
      - 'lib/**'
      - 'include/**'
      - 'src/**'
      - '.github/workflows/*.yml'
      - '!**/*.md'
      - '!src/**/data_*/**'
      - '!src/**/*_backup/**'

permissions:
  contents: read

jobs:
  get_environments:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.read_output.outputs.envs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Save PR metadata
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE:  ${{ github.event.pull_request.title }}
          PR_URL:    ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA:  ${{ github.event.pull_request.head.sha }}
          BASE_REF:  ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          mkdir -p pr-meta
          python3 - <<'PY' > pr-meta/pr_meta.json
          import json, os
          head = os.environ.get("HEAD_REPO", "") or ""
          base = os.environ.get("BASE_REPO", "") or ""
          print(json.dumps({
              "pr_number": os.environ.get("PR_NUMBER"),
              "pr_title":  os.environ.get("PR_TITLE"),
              "pr_url":    os.environ.get("PR_URL"),
              "pr_author": os.environ.get("PR_AUTHOR"),
              "head_sha":  os.environ.get("HEAD_SHA"),
              "base_ref":  os.environ.get("BASE_REF"),
              "head_repo": head,
              "base_repo": base,
              "is_fork":   head != base,
          }))
          PY

      - name: Upload PR metadata
        uses: actions/upload-artifact@v4
        with:
          name: pr-meta
          path: pr-meta/pr_meta.json
          retention-days: 7
          if-no-files-found: error

      - name: Set up Python for parsing
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify contract docs (gate)
        shell: bash
        run: |
          set -e
          echo "=== [1/1] commit_contracts_0202 (dry-run, strict) ==="
          python3 src/v0202/tools_0202/commit_contracts_0202.py --dry-run --strict
          echo "=== [OK] 계약 문서 검증 통과 ==="

      - name: List PlatformIO environments
        id: list_envs
        shell: bash
        run: |
          python - <<'PY' > envs.json
          import configparser, json
          config = configparser.ConfigParser()
          config.read('platformio.ini')
          all_envs = [s.split(':', 1)[1] for s in config.sections() if s.startswith('env:')]
          PREFERRED = ['esp32-s3-n16r8']
          envs = [e for e in all_envs if e in PREFERRED]
          if not envs and 'platformio' in config:
              default = config['platformio'].get('default_envs', '')
              if default:
                  envs = [e.strip() for e in default.split(',') if e.strip()]
          if not envs:
              envs = all_envs
          print(json.dumps(envs))
          PY

      - name: Read environments to output
        id: read_output
        shell: bash
        run: |
          ENVS=$(<envs.json)
          if [ "$ENVS" == "[]" ] || [ -z "$ENVS" ]; then
            echo "Error: No environments found to build!"
            exit 1
          fi
          echo "envs=${ENVS}" >> $GITHUB_OUTPUT

      - name: Prepare env failure marker
        if: failure()
        shell: bash
        run: |
          mkdir -p .ci-failure-env
          echo "get_environments" > .ci-failure-env/env_name.txt
          echo "NONE" > .ci-failure-env/error_files.txt
          echo "platformio.ini 파싱, 계약 문서 검증, 또는 빌드 타깃 환경 식별 실패" > .ci-failure-env/agent_errors.txt
          {
            echo "=== get_environments 단계 실행 오류 ==="
            echo "점검 항목:"
            echo "  - platformio.ini 문법 및 섹션 네이밍"
            echo "  - [env:*] 섹션 정의 여부"
            echo "  - default_envs 파라미터 유효성"
            echo "  - 계약 문서 검증(commit_contracts_0202.py)"
            echo "--- 러너 환경 정보 ---"
            uname -a
            python3 --version || true
          } > .ci-failure-env/failure.log

      - name: Upload env failure marker
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-get-environments
          path: |
            .ci-failure-env/env_name.txt
            .ci-failure-env/error_files.txt
            .ci-failure-env/agent_errors.txt
            .ci-failure-env/failure.log
          retention-days: 7
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    needs: get_environments
    strategy:
      fail-fast: false
      matrix:
        environments: ${{ fromJson(needs.get_environments.outputs.environments) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO Core, Libdeps, and Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ matrix.environments }}-v4-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.environments }}-v4-
            ${{ runner.os }}-pio-

      # ---------------------------------------------------------------
      # [1차 방어] 캐시 복원된 툴체인 실행 가능 여부 검증
      # ---------------------------------------------------------------
      - name: Validate or clean ESP32-S3 toolchain cache
        shell: bash
        run: |
          set +e
          TC_S3=~/.platformio/packages/toolchain-xtensa-esp32s3
          TC_RV=~/.platformio/packages/toolchain-riscv32-esp
          BIN="$TC_S3/bin/xtensa-esp32s3-elf-g++"

          if [ -x "$BIN" ] && "$BIN" --version >/dev/null 2>&1; then
            echo "[OK] Cached ESP32-S3 toolchain is executable — keep as-is."
            "$BIN" --version | head -n 1
          else
            echo "[CLEAN] Cached ESP32-S3 toolchain missing or corrupt — removing for fresh install."
            ls -la "$TC_S3" 2>/dev/null || echo "  (toolchain-xtensa-esp32s3 not present)"
            rm -rf "$TC_S3" "$TC_RV"
          fi
          echo "=== Remaining ~/.platformio/packages entries ==="
          ls -la ~/.platformio/packages/ 2>/dev/null || true

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Pre-install PlatformIO packages
        shell: bash
        run: |
          set +e
          pio pkg install -e ${{ matrix.environments }} 2>&1 | tee pio-pkg-install.log
          PKG_STATUS=${PIPESTATUS[0]}
          echo "pkg_install_status=${PKG_STATUS}"

      # ---------------------------------------------------------------
      # [2차 방어] bin/ 이 비어 있으면 Espressif 공식 툴체인으로 수동 복구
      # - PlatformIO의 압축 해제가 실패하여 패키지 메타데이터만 생성된 경우를 대비.
      # - 공식 crosstool-NG 릴리스의 tar.gz를 받아 bin, lib, xtensa-esp32s3-elf
      #   디렉토리를 PlatformIO 패키지 경로에 직접 배치.
      # ---------------------------------------------------------------
      - name: Repair ESP32-S3 toolchain if bin is empty
        shell: bash
        run: |
          set -e
          TC_DIR="$HOME/.platformio/packages/toolchain-xtensa-esp32s3"
          BIN="$TC_DIR/bin/xtensa-esp32s3-elf-g++"

          if [ -x "$BIN" ]; then
            echo "[OK] Toolchain binary already present: $BIN"
            "$BIN" --version | head -n 1 || true
            exit 0
          fi

          echo "[REPAIR] Toolchain bin is missing. Downloading official Espressif toolchain..."
          TMP=$(mktemp -d)
          URL="https://github.com/espressif/crosstool-NG/releases/download/esp-2021r2-patch5/xtensa-esp32s3-elf-gcc8_4_0-esp-2021r2-patch5-linux-amd64.tar.gz"

          curl -L --fail --retry 3 --retry-delay 5 -o "$TMP/toolchain.tar.gz" "$URL"
          tar -xzf "$TMP/toolchain.tar.gz" -C "$TMP"

          EXTRACTED=$(find "$TMP" -maxdepth 1 -type d -name 'xtensa-esp32s3-elf' | head -n 1)
          if [ -z "$EXTRACTED" ]; then
            echo "[ERROR] Could not find extracted 'xtensa-esp32s3-elf' directory."
            ls -la "$TMP"
            exit 1
          fi

          mkdir -p "$TC_DIR"
          # package.json 등 PlatformIO 메타데이터는 유지하고, 컴파일러 실행에 필요한 디렉토리만 복사
          for d in bin lib xtensa-esp32s3-elf share; do
            if [ -d "$EXTRACTED/$d" ]; then
              cp -a "$EXTRACTED/$d" "$TC_DIR/"
            fi
          done

          if [ -x "$BIN" ]; then
            echo "[OK] Toolchain repaired successfully."
            "$BIN" --version | head -n 1
          else
            echo "[ERROR] Repair failed: $BIN still missing."
            ls -la "$TC_DIR"
            exit 1
          fi

          rm -rf "$TMP"

      - name: Run PlatformIO build for ${{ matrix.environments }}
        id: pio_build
        shell: bash
        env:
          PLATFORMIO_BUILD_CACHE_DIR: /home/runner/.platformio/.cache
        run: |
          set +e
          pio run -e ${{ matrix.environments }} 2>&1 | tee pio-build.log
          status=${PIPESTATUS[0]}
          echo "exit_status=${status}" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Build filesystem image
        if: success()
        shell: bash
        run: |
          DATA_DIR=$(python3 -c "import configparser; c=configparser.ConfigParser(); c.read('platformio.ini'); print(c.get('platformio', 'data_dir', fallback='data'))" 2>/dev/null || echo "src/v0202/data_v0202")
          if [ -d "$DATA_DIR" ] || [ -d "data" ] || [ -d "src/data" ] || [ -d "src/v0202/data_v0202" ]; then
            set +e
            echo -e "\n=== Starting buildfs target (data_dir: $DATA_DIR) ===" | tee -a pio-build.log
            pio run -e ${{ matrix.environments }} --target buildfs 2>&1 | tee -a pio-build.log
            exit ${PIPESTATUS[0]}
          else
            echo "[buildfs skipped] No data folder ($DATA_DIR)" | tee -a pio-build.log
          fi

      - name: Prepare failure marker
        if: failure()
        shell: bash
        run: |
          mkdir -p .ci-failure
          printf '%s' "${{ matrix.environments }}" > .ci-failure/env_name.txt

          if [ -s pio-build.log ]; then
            grep -E '^[^:]+:[0-9]+(:[0-9]+)?: (fatal )?error:' pio-build.log 2>/dev/null \
              | sed -E 's/:[0-9]+(:[0-9]+)?: (fatal )?error:.*$//' \
              | sort -u \
              | awk '
                  /^(\/|\.pio\/libdeps\/|\.platformio\/)/ { print "EXT::" $0; next }
                  { print "PRJ::" $0 }
                ' \
              > .ci-failure/error_files.txt || true
            [ -s .ci-failure/error_files.txt ] || echo "NONE" > .ci-failure/error_files.txt

            grep -E -C 3 \
              -e '^[^:]+:[0-9]+(:[0-9]+)?: (fatal )?error:' \
              -e 'undefined reference to' \
              -e 'multiple definition of' \
              -e 'error: ld returned' \
              -e 'failed to format' \
              pio-build.log 2>/dev/null \
              | head -n 400 \
              | awk '!seen[$0]++ || !/^--$/' \
              > .ci-failure/agent_errors.txt || true
            [ -s .ci-failure/agent_errors.txt ] || echo "특정 컴파일러 에러 키워드 미탐지 (전체 로그 참조 요망)" > .ci-failure/agent_errors.txt

            tail -n 500 pio-build.log > .ci-failure/failure.log
          else
            echo "NONE" > .ci-failure/error_files.txt
            echo "pio-build.log 미생성 (파이썬/의존성 패키지 설치 단계 오류)" > .ci-failure/agent_errors.txt
            {
              echo "=== pio-build.log not produced (early failure) ==="
              echo "--- runner diagnostics ---"
              uname -a
              python --version || true
              pip --version || true
              which pio || echo "pio not installed"
              echo "--- storage usage ---"
              df -h . || true
            } > .ci-failure/failure.log
          fi

          ls -la .ci-failure/

      - name: Compute safe failure artifact name
        id: safe_name
        if: failure()
        shell: bash
        run: |
          SLUG=$(printf '%s' "${{ matrix.environments }}" | tr -c 'A-Za-z0-9._-' '-')
          HASH=$(printf '%s' "${{ matrix.environments }}" | md5sum | cut -c1-8)
          echo "slug=${SLUG}-${HASH}" >> "$GITHUB_OUTPUT"

      - name: Upload failure marker
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ steps.safe_name.outputs.slug }}
          path: |
            .ci-failure/env_name.txt
            .ci-failure/error_files.txt
            .ci-failure/agent_errors.txt
            .ci-failure/failure.log
          retention-days: 7
          if-no-files-found: error

      - name: Compute safe bundle artifact name
        id: safe_bundle
        if: success()
        shell: bash
        run: |
          SLUG=$(printf '%s' "${{ matrix.environments }}" | tr -c 'A-Za-z0-9._-' '-')
          HASH=$(printf '%s' "${{ matrix.environments }}" | md5sum | cut -c1-8)
          echo "slug=${SLUG}-${HASH}" >> "$GITHUB_OUTPUT"

      - name: Upload Unified Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.safe_bundle.outputs.slug }}-build-bundle
          path: |
            .pio/build/${{ matrix.environments }}/firmware.bin
            .pio/build/${{ matrix.environments }}/partitions.bin
            .pio/build/${{ matrix.environments }}/bootloader.bin
            .pio/build/${{ matrix.environments }}/littlefs.bin
          if-no-files-found: warn
          