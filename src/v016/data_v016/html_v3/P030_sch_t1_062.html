
<!-- P030_sch_t1_062.html -->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Wind 스케줄 관리</title>

  <link rel="stylesheet" href="./P000_common_060.css">
  <link rel="stylesheet" href="./P030_sch_t1_062.css">
</head>
<body>

  <header class="nav-bar">
    <div class="nav-container">
      <a href="./P010_main_060.html" class="nav-logo">Smart Wind</a>
      <nav>
        <ul class="nav-menu" id="navMenu"></ul>
      </nav>
    </div>
  </header>

  <div id="toastContainer"></div>
  <div id="loadingOverlay" style="display:none;"><div class="spinner"></div></div>

  <div class="sch-container wrap">
    <div class="sch-header">
      <h1 class="sch-title">📅 Smart Wind 스케줄 관리</h1>
      <div class="space-x-2">
        <button id="btnAddNewSchedule" class="btn ok">+ 새 스케줄</button>
      </div>
    </div>

    <!-- 목록 섹션 -->
    <section id="scheduleListSection" class="card">
      <div class="section-title">스케줄 목록 (<span id="scheduleCount">0</span>개)</div>
      <div id="scheduleListContainer" class="list-container">
        <div class="muted" id="listPlaceholder">스케줄을 로드 중입니다...</div>
      </div>
    </section>

    <!-- 상세/편집 섹션 -->
    <section id="scheduleDetailSection" class="card hidden">
      <div class="row middle">
        <h2 class="section-title">스케줄 편집 (<span id="detailTitle">새 항목</span>)</h2>
        <div class="space-x-2">
          <button id="btnCancelEdit" class="btn">취소</button>
          <button id="btnDeleteSchedule" class="btn err">삭제</button>
          <button id="btnSaveDetail" class="btn ok">저장</button>
        </div>
      </div>

      <div class="mt-4">
        <h3>기본 정보 및 기간</h3>
        <div class="grid">
          <div class="col-4">
            <label class="form-label">스케줄 이름</label>
            <input type="text" id="scheduleNameDetail" class="input-style">
          </div>
          <div class="col-4">
            <label class="form-label">
              <input type="checkbox" id="scheduleEnabledDetail"> 활성화
            </label>
          </div>
        </div>

        <div class="mt-4">
          <label class="form-label">
            <input type="checkbox" id="periodEnabledDetail"> 동작 시간대 Rule 적용
          </label>
          <div id="periodSettingsContainer" class="grid mt-4">
            <div class="col-6">
              <label>시작 시간</label>
              <input type="time" id="startTimeDetail" value="08:00">
            </div>
            <div class="col-6">
              <label>종료 시간</label>
              <input type="time" id="endTimeDetail" value="18:00">
            </div>
            <div class="col-12">
              <label>동작 요일</label>
              <div id="daySelectorsDetail" class="day-toggle"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-4">
        <div class="row middle">
          <h3>동작 단계 (Step)</h3>
          <button id="btnAddSegmentDetail" class="btn ok">+ 단계 추가</button>
        </div>
        <div id="segmentListDetail"></div>
      </div>

      <div class="mt-4">
        <h3>자동 종료 및 움직임 감지</h3>
        <div class="grid">
          <div class="col-6">
            <h4>자동 종료 (AutoOff)</h4>
            <label class="form-label"><input type="checkbox" id="autoOffTimerEnabledDetail"> 작동 타이머</label>
            <div class="autooff-group timer-group hidden">
              <label>시간 (분)</label>
              <input type="number" id="autoOffTimerMinutesDetail" min="0" value="0">
            </div>
            <label class="form-label"><input type="checkbox" id="autoOffOffTimeEnabledDetail"> 종료 시각</label>
            <div class="autooff-group offtime-group hidden">
              <input type="time" id="autoOffOffTimeDetail" value="23:59">
            </div>
            <label class="form-label"><input type="checkbox" id="autoOffOffTempEnabledDetail"> 종료 온도</label>
            <div class="autooff-group offtemp-group hidden">
              <label>온도 (°C)</label>
              <input type="number" id="autoOffOffTempDetail" step="0.1" value="0.0">
            </div>
          </div>
          <div class="col-6">
            <h4>움직임 감지 (Motion)</h4>
            <div class="card">
              <h5>PIR 센서</h5>
              <label class="form-label"><input type="checkbox" id="motionPirEnabledDetail"> PIR 사용</label>
              <div class="motion-group pir-group hidden">
                <label>Hold (초)</label>
                <input type="number" id="motionPirHoldSecDetail" min="0" value="0">
              </div>
            </div>
            <div class="card mt-4">
              <h5>BLE 감지</h5>
              <label class="form-label"><input type="checkbox" id="motionBleEnabledDetail"> BLE 사용</label>
              <div class="motion-group ble-group hidden">
                <label>RSSI 임계값 (dBm)</label>
                <input type="number" id="motionBleRssiThresholdDetail" min="-100" max="-30" value="-70">
                <label>Hold (초)</label>
                <input type="number" id="motionBleHoldSecDetail" min="0" value="0">
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="./P000_common_060.js" defer></script>
  <script src="./P001_API_061.js" defer></script>
  <script src="./P030_sch_t1_062.js" defer></script>
</body>
</html>
