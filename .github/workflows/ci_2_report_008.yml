# =====================================================================
# .github/workflows/ci_2_report_008.yml
# ---------------------------------------------------------------------
# Smart Nature Wind (v0200 / v0201) PR 빌드 실패 리포트 파이프라인 (에이전트 단일 컨텍스트 집약형)
#
# [설계 원칙]
#   1. 단일 본문 집약 (No Multi-Comment):
#      - 에이전트 CLI(Antigravity, Claude Code)가 `gh issue view <No>` 단 1회
#        호출로 전체 작업 지시, 대상 소스 파일, 재현 명령어를 수득하도록 설계.
#   2. GitHub API 본문 상한(65,536자) 원천 방어:
#      - 전체 예산(BODY_BUDGET: 55,000자)을 설정하고, 실패 환경 수에 따라
#        환경별 에러 진단 텍스트 슬롯을 동적으로 분배함.
#   3. 마크다운 깨짐 방지:
#      - 4중 백틱(````text ... ````) 블록을 적용하여 로그 내 3중 백틱이나
#        GFM 예약 문자가 포함되어도 이슈 파싱이 파손되지 않음.
#   4. 멱등성 보장 (Idempotent):
#      - 마커(<!-- ci-fail-pr:<pr_number> -->) 기반으로 기존 이슈를 감지하여
#        신규 코멘트 남발 없이 issues.update(본문 교체)로 갱신함 (알림 스팸 없음).
#   5. 다중 PR 메타데이터 복원 & 조기 차단(Pre-build Gate) 식별:
#      - 아티팩트 유실 시 commit_sha 기반 연계 PR 역추적 지원.
#      - 계약 문서 검증 실패 등 빌드 전 단계 조기 차단 시 점검 가이드 자동 제공.
# =====================================================================

name: PR Report Failure

on:
  workflow_run:
    # ci_1_build_009.yml의 최상단 name과 일치 필수
    workflows: ["PR Build"]
    types: [completed]

permissions:
  issues: write
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-2-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      # ---------------------------------------------------------------
      # 타 실행 run의 아티팩트 다운로드
      # ---------------------------------------------------------------
      - name: Download PR metadata
        uses: actions/download-artifact@v4
        with:
          name: pr-meta
          path: pr-meta/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download failure markers
        uses: actions/download-artifact@v4
        with:
          pattern: 'failure-*'
          path: failure-markers/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Debug collected files
        shell: bash
        run: |
          echo "=== 1. pr-meta ==="
          find pr-meta -type f 2>/dev/null | sort || true
          echo "=== 2. failure-markers ==="
          find failure-markers -type f 2>/dev/null | sort || true

      # ---------------------------------------------------------------
      # 이슈 본문 생성 또는 갱신
      # ---------------------------------------------------------------
      - name: Create or update failure issue
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        with:
          script: |
            const fs   = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;

            // ==========================================================
            // 상수 정의 (GitHub API 한도 방어)
            // ==========================================================
            const BODY_BUDGET = 55000;
            const TITLE_LIMIT = 256;

            // ==========================================================
            // 1. PR 메타데이터 복원 (3단계 계층 폴백)
            // ==========================================================
            let meta = null;
            const metaPath = 'pr-meta/pr_meta.json';
            if (fs.existsSync(metaPath)) {
              try { meta = JSON.parse(fs.readFileSync(metaPath, 'utf8')); }
              catch (e) { core.warning(`pr_meta.json 파싱 오류: ${e.message}`); }
            }

            // 1-2. workflow_run payload 폴백
            if (!meta || !meta.pr_number) {
              const prs = context.payload.workflow_run.pull_requests || [];
              if (prs.length > 0) {
                meta = {
                  pr_number: prs[0].number,
                  pr_title:  prs[0].title || '(unknown)',
                  pr_url:    prs[0].html_url || '',
                  pr_author: (prs[0].user && prs[0].user.login) || 'unknown',
                  head_sha:  context.payload.workflow_run.head_sha,
                  base_ref:  context.payload.workflow_run.head_branch,
                  is_fork:   false,
                };
              }
            }

            // 1-3. commit SHA 기반 연관 PR 역추적 폴백 (Fork PR 등 대응)
            if (!meta || !meta.pr_number) {
              const headSha = context.payload.workflow_run.head_sha;
              if (headSha) {
                try {
                  const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                    owner, repo, commit_sha: headSha
                  });
                  if (associated.data && associated.data.length > 0) {
                    const pr0 = associated.data[0];
                    meta = {
                      pr_number: pr0.number,
                      pr_title:  pr0.title || '(unknown)',
                      pr_url:    pr0.html_url || '',
                      pr_author: (pr0.user && pr0.user.login) || 'unknown',
                      head_sha:  headSha,
                      base_ref:  pr0.base && pr0.base.ref,
                      is_fork:   pr0.head && pr0.head.repo && (pr0.head.repo.full_name !== `${owner}/${repo}`),
                    };
                    core.info(`커밋 SHA(${headSha.slice(0, 7)}) 기반으로 PR #${pr0.number} 식별 완료.`);
                  }
                } catch (err) {
                  core.warning(`커밋 연관 PR 역추적 실패: ${err.message}`);
                }
              }
            }

            if (!meta || !meta.pr_number) {
              core.setFailed('PR 메타데이터 복원 불가 (pr_meta.json 없음, 연계 PR 없음).');
              return;
            }

            const prNumber = String(meta.pr_number);
            const marker   = `<!-- ci-fail-pr:${prNumber} -->`;

            // ==========================================================
            // 2. 실패 마커 수집 (재귀 탐색)
            // ==========================================================
            const failures = [];
            function collectMarkers(dir) {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir)) {
                const fullPath = path.join(dir, entry);
                const stat = fs.statSync(fullPath);
                if (stat.isDirectory()) { collectMarkers(fullPath); continue; }
                if (entry !== 'env_name.txt') continue;

                const logDir = path.dirname(fullPath);
                const env = fs.readFileSync(fullPath, 'utf8').trim() || path.basename(logDir);

                const filesRaw = (() => {
                  const p = path.join(logDir, 'error_files.txt');
                  return fs.existsSync(p) ? fs.readFileSync(p, 'utf8').trim() : '';
                })();

                const prjFiles = [];
                const extFiles = [];
                for (const line of filesRaw.split('\n')) {
                  const t = line.trim();
                  if (!t || t === 'NONE') continue;
                  if (t.startsWith('PRJ::')) prjFiles.push(t.slice(5));
                  else if (t.startsWith('EXT::')) extFiles.push(t.slice(5));
                  else prjFiles.push(t);
                }

                const errorsRaw = (() => {
                  const p = path.join(logDir, 'agent_errors.txt');
                  return fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '';
                })();

                const rawTail = (() => {
                  const p = path.join(logDir, 'failure.log');
                  return fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : '';
                })();

                failures.push({
                  env,
                  prjFiles,
                  extFiles,
                  errors: errorsRaw.trim(),
                  rawTail: rawTail.trim(),
                });
              }
            }
            collectMarkers('failure-markers');

            // ==========================================================
            // 3. 동적 본문 예산 배분
            // ==========================================================
            const HEADER_BUDGET = 2000;
            const FOOTER_BUDGET = 800;
            const envCount = Math.max(failures.length, 1);
            const envBudget = Math.max(
              1500,
              Math.floor((BODY_BUDGET - HEADER_BUDGET - FOOTER_BUDGET) / envCount)
            );
            core.info(`실패 환경 수: ${failures.length}개 / 환경당 할당 예산: ${envBudget}자`);

            // ==========================================================
            // 4. 수정 대상 파일 정리 (중복 제거 및 분리)
            // ==========================================================
            const allPrj = [...new Set(failures.flatMap(f => f.prjFiles))];
            const allExt = [...new Set(failures.flatMap(f => f.extFiles))];

            const targetFilesMd = allPrj.length
              ? allPrj.map(f => `- [ ] \`${f}\``).join('\n')
              : failures.length > 0
                ? '- _(특정 소스 파일 식별 불가 — 컴파일러 진단 로그 직접 확인 요망)_'
                : '- _(빌드 전 단계 실패로 수정 소스 파일이 추출되지 않음)_';

            const extFilesMd = allExt.length
              ? allExt.slice(0, 10).map(f => `- \`${f}\``).join('\n')
                + (allExt.length > 10 ? `\n- _...외 ${allExt.length - 10}개 라이브러리 헤더_` : '')
              : null;

            // ==========================================================
            // 5. 환경별 에러 블록 렌더링
            // ==========================================================
            function fence(text) {
              return '````text\n' + text + '\n````';
            }

            function buildEnvBlock(f) {
              const lines = [
                `### 🔧 대상 환경: \`${f.env}\``,
                ``,
                `**로컬 빌드 재현 명령어 (Reproduction Command):**`,
                '```bash',
                `pio run -e "${f.env}"`,
                '```',
                ``,
              ];

              if (f.prjFiles.length) {
                lines.push(`**수정 대상 소스 파일 (Project files):**`);
                lines.push(f.prjFiles.map(x => `- [ ] \`${x}\``).join('\n'));
                lines.push('');
              }

              if (f.extFiles.length) {
                lines.push(`**참조된 외부 헤더 (External headers, 직접 수정 불필요):**`);
                lines.push(
                  f.extFiles.slice(0, 5).map(x => `- \`${x}\``).join('\n')
                  + (f.extFiles.length > 5 ? `\n- _...외 ${f.extFiles.length - 5}개_` : '')
                );
                lines.push('');
              }

              lines.push(`**컴파일러 정밀 진단 로그 (Compiler Diagnostics):**`);

              const fixedOverhead = lines.join('\n').length + 32;
              const errorsSlot = Math.max(500, envBudget - fixedOverhead);

              const rawErrors = f.errors || '(진단 메시지 없음)';
              const errText = rawErrors.length > errorsSlot
                ? rawErrors.slice(0, errorsSlot - 60)
                  + `\n\n... [일부 생략 / 전체 원본은 Actions Run 아티팩트 참조] ...\n`
                  + rawErrors.slice(-40)
                : rawErrors;

              lines.push(fence(errText));
              return lines.join('\n');
            }

            const envBlocksMd = failures.length
              ? failures.map(buildEnvBlock).join('\n\n---\n\n')
              : [
                  `### ⚠️ 빌드 진입 전 조기 차단 (Pre-build Gate Failure)`,
                  ``,
                  `개별 타깃 환경 컴파일 단계에 진입하기 전에 파이프라인이 중단되었습니다.`,
                  `가장 유력한 원인은 다음과 같습니다:`,
                  ``,
                  `1. **계약 문서 무결성 검증 실패 (Gate)**:`,
                  `   - CBD v2.5 계약 문서 7종 무결성 또는 포맷 위반`,
                  `   - **로컬 검증 커맨드**:`,
                  `     \`\`\`bash`,
                  `     python src/v0200/tools_0201/commit_contracts_0201.py --dry-run --strict`,
                  `     # 또는: python src/v0200/tools_0200/commit_contracts_0200.py --dry-run --strict`,
                  `     \`\`\``,
                  `2. **\`platformio.ini\` 설정 오류**:`,
                  `   - 환경 구문 파싱 실패 또는 \`default_envs\` 미존재`,
                  `3. **Git Checkout 또는 워크플로우 셋업 실패**:`,
                  `   - 상세 로그는 하단 Actions Run 링크를 확인하십시오.`,
                ].join('\n');

            // ==========================================================
            // 6. 폴백 로그 블록 (잔여 예산 한도 내 포함)
            // ==========================================================
            const rawLogMd = (() => {
              if (!failures.length) return '';
              const remaining = Math.max(0, BODY_BUDGET - HEADER_BUDGET - FOOTER_BUDGET - envBlocksMd.length - 500);
              if (remaining < 800) return '';

              const head = failures[0];
              if (!head.rawTail) return '';
              const cap = Math.min(remaining - 200, 3000);
              const tail = head.rawTail.length > cap
                ? '...(앞부분 생략)\n' + head.rawTail.slice(-cap)
                : head.rawTail;
              return [
                `<details>`,
                `<summary>📎 <strong>터미널 후반 로그 버퍼 (참조용 / \`${head.env}\`)</strong></summary>`,
                ``,
                '````text',
                tail,
                '````',
                `</details>`,
              ].join('\n');
            })();

            // ==========================================================
            // 7. 최종 단일 이슈 본문 조립
            // ==========================================================
            const shortSha = (meta.head_sha || '').slice(0, 7);
            const envNamesShort = failures.length ? failures.map(f => f.env).join(', ') : 'Pre-build Gate';

            const quickContext = [
              `## ⚡ AI 에이전트 작업 가이드 (Quick Context)`,
              ``,
              `- **활성 펌웨어 / 소스 버전**: \`v0200\` (C++ 백엔드 \`_0201\` 접미사 / LittleFS \`data_v0201\`)`,
              `- **개발 규칙 SSOT**: [\`agent.md\`](https://github.com/${owner}/${repo}/blob/${meta.head_sha || 'main'}/agent.md)`,
              `- **실패 환경 / 단계**: \`${envNamesShort}\``,
              `- **로컬 재현 커맨드**: \`pio run -e esp32-s3-n16r8\` (또는 \`python src/v0200/tools_0201/commit_contracts_0201.py --dry-run --strict\`)`,
              `- **우선 수정 소스**: ${allPrj.length ? allPrj.slice(0, 5).map(f => `\`${f}\``).join(', ') + (allPrj.length > 5 ? ` … (+${allPrj.length - 5})` : '') : '_파일 특정 불가 또는 사전 게이트 실패_'}`,
              `- **전체 로그 확인**: [Actions Run 링크](${process.env.RUN_URL}) (아티팩트 보존 기간: 7일)`,
              ``,
              `**🤖 에이전트 CLI 실행 가이드:**`,
              '```bash',
              `gh issue view ${prNumber} | antigravity "agent.md와 contract_doc_0200 규칙을 준수하여 src/v0200/ 활성 소스의 에러를 분석 및 수정하고, pio run으로 로컬 빌드를 검증하십시오."`,
              '```',
              ``,
            ].join('\n');

            const metaTable = [
              `## 📋 PR 메타데이터`,
              ``,
              `| 항목 | 세부 정보 |`,
              `|:---|:---|`,
              `| PR 대상 | [#${prNumber}](${meta.pr_url}) - ${meta.pr_title} |`,
              `| 작성자 | @${meta.pr_author} |`,
              `| 타깃 커밋 | \`${shortSha}\` (Base: \`${meta.base_ref || 'unknown'}\`) |`,
              `| 외부 Fork PR | \`${meta.is_fork ? 'Yes' : 'No'}\` |`,
              `| Actions Run | [워크플로우 결과 확인](${process.env.RUN_URL}) |`,
              ``,
            ].join('\n');

            const targetSection = [
              `## 📂 수정 대상 파일 목록 (Target Files)`,
              ``,
              targetFilesMd,
              ...(extFilesMd ? [``, `**참조된 외부 헤더 파일 (수정 대상 아님):**`, extFilesMd] : []),
              ``,
            ].join('\n');

            const errorsSection = [
              `## 🔍 컴파일 에러 상세 및 진단 (Diagnostics)`,
              ``,
              envBlocksMd,
              ``,
            ].join('\n');

            const refsSection = [
              `## 🔗 참고 링크 및 아티팩트`,
              ``,
              `- 워크플로우 실행 세부정보: ${process.env.RUN_URL}`,
              `- 컴파일 실패 마커 아티팩트: \`failure-*\` (7일 보존)`,
              `- 정상 빌드 산출물 아티팩트: \`*-build-bundle\``,
              ``,
              `---`,
              `_본 이슈는 CI 파이프라인에 의해 자동 관리되며, PR이 갱신되거나 해결 시 최신 상태로 본문이 자동 갱신됩니다._`,
            ].join('\n');

            let body = [
              quickContext,
              metaTable,
              targetSection,
              errorsSection,
              rawLogMd ? rawLogMd + '\n' : '',
              refsSection,
            ].join('\n');

            // 본문 길이 안전 검증
            if (body.length > BODY_BUDGET) {
              core.warning(`본문 예산 초과 감지 (${body.length} > ${BODY_BUDGET}). 오류 섹션 강제 슬라이싱 수행.`);
              const shrunk = errorsSection.slice(0, Math.floor(BODY_BUDGET * 0.4))
                + '\n\n_... [예산 초과로 인한 생략 / 상세 내용은 Actions Run 아티팩트 참조] ..._';
              body = body.replace(errorsSection, shrunk);
            }

            // ==========================================================
            // 8. 기존 이슈 탐색 및 생성 / 갱신
            // ==========================================================
            const PREFIX = `[CI-FAIL] PR #${prNumber} `;
            const rawTitle = meta.pr_title || '(no title)';
            const maxTitleLen = TITLE_LIMIT - PREFIX.length - 8;
            const safeTitle = rawTitle.length > maxTitleLen
              ? rawTitle.slice(0, maxTitleLen - 1) + '…'
              : rawTitle;
            const title = `${PREFIX}${safeTitle}`;

            let existing = null;
            for (let page = 1; page <= 5 && !existing; page++) {
              const res = await github.rest.issues.listForRepo({
                owner, repo, state: 'open',
                per_page: 100, page,
                sort: 'created', direction: 'desc',
              });
              existing = res.data.find(it =>
                !it.pull_request && it.body && it.body.includes(marker)
              );
              if (res.data.length < 100) break;
            }

            const issuePayload = {
              owner,
              repo,
              title,
              body: `${marker}\n${body}`,
            };

            if (existing) {
              await github.rest.issues.update({
                ...issuePayload,
                issue_number: existing.number,
              });
              core.info(`기존 이슈 갱신 완료: #${existing.number}`);
            } else {
              const created = await github.rest.issues.create(issuePayload);
              core.info(`신규 이슈 생성 완료: #${created.data.number}`);

              // 라벨 추가 시도 (실패해도 워크플로우 중단 방지)
              try {
                await github.rest.issues.addLabels({
                  owner, repo,
                  issue_number: created.data.number,
                  labels: ['ci-failure', 'build-failed'],
                });
              } catch (lblErr) {
                core.warning(`이슈 라벨 추가 생략 (라벨 미존재 가능): ${lblErr.message}`);
              }
            }
