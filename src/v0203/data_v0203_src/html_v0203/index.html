<!DOCTYPE html>
<html lang="ko" style="color-scheme: dark;">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark"> <!-- ★ 추가 -->
    <meta name="theme-color" content="#0f1419">
    <title data-i18n="app.title">Smart Nature Wind</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
    <script>
        window.SNW_OFFLINE = (location.protocol === 'file:') ||
            location.hostname === 'localhost' ||
            location.hostname === '127.0.0.1' ||
            new URLSearchParams(location.search).has('offline');

        if (window.SNW_OFFLINE) {
            [
                './css/_base.css', './css/_layout.css', './css/_comp_ui.css', './css/_comp_form.css',
                './css/_dashboard.css', './css/_player_bar.css', './css/_studio.css',
                './css/_schedule.css', './css/_monitor.css', './css/_misc_pages.css', './css/_rules.css'
            ].forEach(function (href) {
                document.write('<link rel="stylesheet" href="' + href + '">');
            });
        } else {
            document.write('<link rel="stylesheet" href="./common_base_0203.css.gz">');
            document.write('<link rel="stylesheet" href="./common_pages_0203.css.gz">');
        }
    </script>
</head>

<body>
    <div id="app" class="snw-app">

        <header class="snw-header" id="snw-header">
            <button class="snw-btn-icon" id="btn-menu" aria-label="Menu">☰</button>
            <span class="snw-brand" data-i18n="app.title">Smart Nature Wind</span>
            <div class="snw-header-right">
                <span class="snw-status-dot" id="conn-status" title=""></span>
                <span class="snw-clock" id="header-clock">--:--</span>
                <button class="snw-btn-icon" id="btn-lang" aria-label="Language">🌐</button>
            </div>
        </header>

        <aside class="snw-sidebar" id="snw-sidebar">
            <nav id="nav-menu"></nav>
        </aside>

        <div class="snw-sidebar-overlay" id="snw-sidebar-overlay"></div>

        <main class="snw-main" id="snw-main">
            <div class="snw-loading" data-i18n="common.loading">Loading...</div>
        </main>

        <!-- ★ Now Playing Bar (v0203 Stage 3 신규) -->
        <div id="now-playing-bar" class="snw-nowplaying" hidden>
            <div class="snw-nowplaying__left" data-action="expand">
                <canvas class="snw-nowplaying__eq" width="20" height="16"></canvas>
                <div class="snw-nowplaying__info">
                    <div class="snw-nowplaying__title" data-slot="np-title">-</div>
                    <div class="snw-nowplaying__sub">
                        <span data-slot="np-step">-</span>
                        <span data-slot="np-time">-</span>
                    </div>
                </div>
                <div class="snw-nowplaying__badge" data-slot="np-pending" hidden>
                    <span class="strike">⏰</span>
                </div>
                <div class="snw-nowplaying__badge snw-nowplaying__badge--timer" data-slot="np-timer" hidden
                    title="타이머 설정">
                    <span>⏱️ <span data-slot="np-timer-val"></span></span>
                </div>
                <div class="snw-nowplaying__badge snw-nowplaying__badge--auto" data-slot="np-auto-badge" hidden
                    title="자동 Comfort 모드 가동 중" style="background:rgba(40,167,69,0.15);color:#28a745;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:600;">
                    <span>🌱 자동</span>
                </div>
            </div>
            <div class="snw-nowplaying__controls">
                <button class="snw-np-btn" data-action="pause" aria-label="일시정지">⏸</button>
                <button class="snw-np-btn" data-action="stop" aria-label="정지">⏹</button>
            </div>
        </div>

        <!-- 👇 모바일 하단 탭 바 (5개 — Stage 5 재편) -->
        <nav class="snw-bottom-nav" id="mobile-bottom-nav">
            <a href="#/home" data-route="/home" class="snw-bottom-nav__item">
                <span class="snw-bottom-nav__icon">🏠</span>
                <span class="snw-bottom-nav__label" data-i18n="nav.home">홈</span>
            </a>
            <a href="#/wind" data-route="/wind" class="snw-bottom-nav__item">
                <span class="snw-bottom-nav__icon">🌬️</span>
                <span class="snw-bottom-nav__label" data-i18n="nav.wind">바람</span>
            </a>
            <a href="#/automation" data-route="/automation" class="snw-bottom-nav__item">
                <span class="snw-bottom-nav__icon">⚙️</span>
                <span class="snw-bottom-nav__label" data-i18n="nav.automation">자동화</span>
            </a>
            <a href="#/monitor" data-route="/monitor" class="snw-bottom-nav__item">
                <span class="snw-bottom-nav__icon">📊</span>
                <span class="snw-bottom-nav__label" data-i18n="nav.monitor">모니터</span>
            </a>
            <a href="#/settings" data-route="/settings" class="snw-bottom-nav__item">
                <span class="snw-bottom-nav__icon">🔧</span>
                <span class="snw-bottom-nav__label" data-i18n="nav.settings">설정</span>
            </a>
        </nav>

        <footer class="snw-footer">
            <span id="footer-status" data-i18n="footer.online">🟢</span>
            <span class="snw-footer-spacer"></span>
            <span id="footer-lastUpdate">-</span>
        </footer>

        <div class="snw-toast-host" id="toast-host"></div>
    </div>

    <script>
        console.log('[Loader] SNW_OFFLINE =', window.SNW_OFFLINE);

        if (window.SNW_OFFLINE) {
            [
                './js/998.offline_data_0203.js',
                './js/998.offline_0203.js',
                './js/core/000.const.js', './js/core/010.config.js', './js/core/020.i18n.js',
                './js/core/030.util.level.js', './js/core/030.util.time.js', './js/core/031.util.dom.js',
                './js/core/032.util.log.js', './js/core/033.util.template.js', './js/core/034.util.toast.js',
                './js/core/035.util.feedback.js', './js/core/040.api.js', './js/core/050.ws.js',
                './js/core/060.store.js', './js/core/070.router.js',
                './js/core/100.ui.badge.js', './js/core/101.ui.toggle.js', './js/core/102.ui.gauge.js',
                './js/core/110.ui.slider.js', './js/core/115.ui.eq.js', './js/core/116.ui.sparkline.js',
                './js/core/117.ui.haptic.js', './js/core/120.ui.chart.js', './js/core/130.ui.form.js',
                './js/core/135.util.preview.js', './js/core/140.ui.simulation.js',
                './js/core/145.ai.client.js', './js/core/146.ai.voice.js', './js/core/147.ai.live.js',
                './js/core/147a.audio.capture.js', './js/core/147b.audio.playback.js', './js/core/147c.ai.chat.core.js',
                './js/core/150.ui.rule_editor.js',
                './js/app/200.page.dashboard.js', './js/app/210.page.chart.js', './js/app/225.page.sensors.js',
                './js/app/240.page.settings.js', './js/app/245.page.simulation.js', './js/app/250.page.diagnostics.js',
                './js/app/260.page.firmware.js', './js/app/260.page.monitor.js', './js/app/270.page.network.js',
                './js/app/280.page.logs.js', './js/app/290.page.ai.js', './js/app/290.page.automation.js',
                './js/app/291.studio.js', './js/app/292.playlist.js', './js/app/293.schedule_panel.js',
                './js/app/294.timer_panel.js', './js/app/300.page.windprofile.js', './js/app/310.page.rules.js',
                './js/app/998.onboarding.js', './js/app/999.app.js', './js/app/999a.nowplaying.js', './js/app/999b.ai-sheet.js'
            ].forEach(function (src) {
                document.write('<script defer src="' + src + '"><\/script>');
            });
        } else {
            document.write('<script defer src="./app_core_0203.js.gz"><\/script>');
            document.write('<script defer src="./app_ui_0203.js.gz"><\/script>');
            document.write('<script defer src="./app_pages_0203.js.gz"><\/script>');
        }
    </script>

</body>

</html>
