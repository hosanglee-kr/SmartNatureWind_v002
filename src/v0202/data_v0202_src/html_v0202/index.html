<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f1419">
    <title data-i18n="app.title">Smart Nature Wind</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
    <link rel="stylesheet" href="./P000_common_0202.css">
</head>
<body>

<div id="app" class="snw-app">

    <header class="snw-header" id="snw-header">
        <button class="snw-btn-icon" id="btn-menu" aria-label="Menu">☰</button>
        <span class="snw-brand" data-i18n="app.title">Smart Nature Wind</span>
        <div class="snw-header-right">
            <span class="snw-status-dot" id="conn-status" title=""></span>
            <span class="snw-clock" id="header-clock">--:--</span>
            <button class="snw-btn-icon" id="btn-lang" aria-label="Language">🌐</button>
        </div>
    </header>

    <aside class="snw-sidebar" id="snw-sidebar">
        <nav id="nav-menu"></nav>
    </aside>

    <div class="snw-sidebar-overlay" id="snw-sidebar-overlay"></div>

    <main class="snw-main" id="snw-main">
        <div class="snw-loading" data-i18n="common.loading">Loading...</div>
    </main>

    <!-- 👇 모바일 하단 탭 바 추가 -->
    <nav class="snw-bottom-nav" id="mobile-bottom-nav">
        <a href="#/dashboard" data-route="/dashboard" class="snw-bottom-nav__item">
            <span class="snw-bottom-nav__icon">📊</span>
            <span class="snw-bottom-nav__label" data-i18n="nav.dashboard">대시보드</span>
        </a>
        <a href="#/chart" data-route="/chart" class="snw-bottom-nav__item">
            <span class="snw-bottom-nav__icon">📈</span>
            <span class="snw-bottom-nav__label" data-i18n="nav.chart">차트</span>
        </a>
        <a href="#/schedule" data-route="/schedule" class="snw-bottom-nav__item">
            <span class="snw-bottom-nav__icon">📅</span>
            <span class="snw-bottom-nav__label" data-i18n="nav.schedule">스케줄</span>
        </a>
        <a href="#/settings" data-route="/settings" class="snw-bottom-nav__item">
            <span class="snw-bottom-nav__icon">⚙</span>
            <span class="snw-bottom-nav__label" data-i18n="nav.settings">설정</span>
        </a>
        <!-- '더보기' 탭 추가 (클릭 시 사이드바 열림) -->
        <a href="javascript:void(0)" onclick="document.getElementById('btn-menu').click()" class="snw-bottom-nav__item">
            <span class="snw-bottom-nav__icon">···</span>
            <span class="snw-bottom-nav__label">더보기</span>
        </a>
    
    </nav>

    <footer class="snw-footer">
        <span id="footer-status" data-i18n="footer.online">🟢</span>
        <span class="snw-footer-spacer"></span>
        <span id="footer-lastUpdate">-</span>
    </footer>

    <div class="snw-toast-host" id="toast-host"></div>
</div>

<script>
    window.SNW_OFFLINE = (location.protocol === 'file:') ||
        location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1' ||
        new URLSearchParams(location.search).has('offline');
    
    console.log('[Loader] SNW_OFFLINE =', window.SNW_OFFLINE);
    
    if (window.SNW_OFFLINE) {
        document.write('<script src="./js/998.offline_0202.js"><\/script>');
    }
</script>

<script src="./P010_bundle_0202.js"></script>

</body>
</html>
